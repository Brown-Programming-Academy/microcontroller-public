; PlatformIO Project Configuration File
;
; Three implementations of the Simon game, one environment each:
;   pio run -e baremetal -t upload
;   pio run -e espidf    -t upload
;   pio run -e arduino   -t upload

[env]
platform = espressif32
board = freenove_esp32_s3_wroom
monitor_speed = 115200

[env:baremetal]
framework = arduino
build_flags = -D SIMON_BAREMETAL
build_src_filter = +<simon_baremetal.cpp>

[env:espidf]
framework = espidf
build_src_filter = +<simon_espidf.cpp>

[env:arduino]
framework = arduino
build_src_filter = +<simon_arduino.cpp>
